name: CI - JSON Schema Annotation Tests (Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # if JSON-Schema-Test-Suite is a submodule

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'        # or '3.11', '3.13' — any recent version works
          cache: 'pip'                  # speeds up repeated runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jschon[requests]"    # [requests] enables remote $ref support

      - name: Run annotation tests
        run: python run_harness.py        # Change this if your script has a different name

      - name: Upload test report (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-test-report
          path: |
            data/report.json
            data/report.html